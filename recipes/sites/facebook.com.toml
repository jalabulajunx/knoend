# Drafted by the OpenPager configure agent (gemini/gemini-3.8-flash) on Linux, then used and kept by
# Sundar. Tested on Linux only: other systems need their own match entries and a test.
[[key]]
icon = "search"
label = "Search"

[key.action]
kind = "focus"
selector = 'input[aria-label="Search Facebook"]'

[[key]]
icon = "home"
label = "Home"

[key.action]
kind = "open"
url = "/"

[[key]]
icon = "person"
label = "Profile"

[key.action]
kind = "element"
selector = 'div[aria-label="Your profile"]'

[[key]]
icon = "chat"
label = "New Message"

[key.action]
kind = "element"
selector = 'div[aria-label="New message"]'

[[key]]
icon = "group"
label = "Friends"

[key.action]
kind = "open"
url = "/friends/"

[[key]]
icon = "apps"
label = "Groups"

[key.action]
kind = "open"
url = "/groups/"

[[key]]
icon = "movie"
label = "Reels"

[key.action]
kind = "open"
url = "/reel/"

[[key]]
label = "Marketplace"

[key.action]
kind = "open"
url = "/marketplace/"

[[key]]
icon = "bookmark"
label = "Saved"

[key.action]
kind = "open"
url = "/saved/"

[match]
web = ["facebook.com"]

[pack]
description = "Essential navigation, search, and shortcuts for Facebook."
id = "builtin.site-facebook-com"
name = "Facebook"
source = "builtin"
version = "0.1.0"

[[pack.tested]]
os = "linux"
by = "Sundar"
date = "2026-10-18"
note = "Arch Linux, i3 (X11), Firefox"
