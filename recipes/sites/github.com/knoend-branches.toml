# Drafted by the KnoEnd configure agent (gemini/gemini-3.8-flash) on Linux, then used and kept by
# Sundar. Tested on Linux only: other systems need their own match entries and a test.
[[key]]
icon = "search"
label = "Find Branch"

[key.action]
kind = "focus"
selector = "div > div > div:nth-of-type(1) > span > input"

[[key]]
icon = "person"
label = "Your Branches"

[key.action]
kind = "open"
url = "/jalabulajunx/knoend/branches/yours"

[[key]]
icon = "schedule"
label = "Active"

[key.action]
kind = "open"
url = "/jalabulajunx/knoend/branches/active"

[[key]]
icon = "lock"
label = "Branch Rules"

[key.action]
kind = "open"
url = "/jalabulajunx/knoend/settings/rules/new"

[[key]]
icon = "code"
label = "Code"

[key.action]
kind = "open"
url = "/jalabulajunx/knoend"

[[key]]
icon = "task_alt"
label = "Actions"

[key.action]
kind = "open"
url = "/jalabulajunx/knoend/actions"

[[key]]
icon = "dashboard"
label = "Insights"

[key.action]
kind = "open"
url = "/jalabulajunx/knoend/pulse"

[[key]]
icon = "description"
label = "Wiki"

[key.action]
kind = "open"
url = "/jalabulajunx/knoend/wiki"

[[key]]
icon = "settings"
label = "Settings"

[key.action]
kind = "open"
url = "/jalabulajunx/knoend/settings"

[match]
web = ["github.com/jalabulajunx/knoend/branches"]

[pack]
description = "Quick branch searching and repository navigation."
id = "builtin.site-github-com-knoend-branches"
name = "KnoEnd Branches"
source = "builtin"
version = "0.1.0"

[[pack.tested]]
os = "linux"
by = "Sundar"
date = "2026-10-18"
note = "Arch Linux, i3 (X11), Firefox"
