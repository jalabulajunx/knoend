# Drafted by the KnoEnd configure agent (gemini/gemini-3.8-flash) on Linux, then used and kept by
# Sundar. Tested on Linux only: other systems need their own match entries and a test.
[[key]]
label = "Present"
speak = "Start presentation"

[key.action]
keys = "Ctrl+F5"
kind = "shortcut"

[[key]]
label = "New Slide"
speak = "Insert new slide"

[key.action]
keys = "Ctrl+M"
kind = "shortcut"

[[key]]
label = "Text Box"
speak = "Insert text box"

[key.action]
kind = "element"
selector = "#textboxButton"

[[key]]
label = "Shape"
speak = "Insert shape"

[key.action]
kind = "element"
selector = "#shapeButton"

[[key]]
label = "Comment"
speak = "Add comment"

[key.action]
keys = "Ctrl+Alt+M"
kind = "shortcut"

[[key]]
label = "Search Menus"
speak = "Search menus"

[key.action]
kind = "focus"
selector = 'input[aria-label="Menus"]'

[[key]]
label = "Grid View"
speak = "Toggle grid view"

[key.action]
kind = "element"
selector = "#grid-view-toggle"

[[key]]
label = "Comments"
speak = "Show comments"

[key.action]
kind = "element"
selector = "#docs-docos-commentsbutton"

[[key]]
label = "Slides Home"
speak = "Go to Slides home"

[key.action]
kind = "open"
url = "/presentation/u/0/"

[match]
web = ["docs.google.com"]

[pack]
description = "Quick shortcuts and controls for editing and presenting Google Slides."
id = "builtin.site-docs-google-com"
name = "Google Slides"
source = "builtin"
version = "0.1.0"

[[pack.tested]]
os = "linux"
by = "Sundar"
date = "2026-10-18"
note = "Arch Linux, i3 (X11), Firefox"
