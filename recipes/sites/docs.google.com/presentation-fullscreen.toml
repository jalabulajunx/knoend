# Built-in library for a Google Slides presentation while it is showing (the page is full screen,
# reported by the KnoEnd extension on an allowed site). The keys are Slides' own presenting
# shortcuts, typed as real key presses.
[pack]
id = "builtin.google-slides-present"
name = "Presenting"
version = "0.1.0"
source = "builtin"
license = "MIT"

[match]
web = ["docs.google.com/presentation@fullscreen"]

[[key]]
label = "Prev"
icon = "chevron_left"
speak = "Previous slide"
action = { kind = "shortcut", keys = "Left" }

[[key]]
label = "Next"
icon = "chevron_right"
speak = "Next slide"
action = { kind = "shortcut", keys = "Right" }

[[key]]
label = "Exit"
icon = "close"
speak = "Stop presenting"
action = { kind = "shortcut", keys = "Escape" }

[[key]]
label = "First"
icon = "first_page"
speak = "First slide"
action = { kind = "shortcut", keys = "Home" }

[[key]]
label = "Last"
icon = "last_page"
speak = "Last slide"
action = { kind = "shortcut", keys = "End" }

[[key]]
label = "Laser"
icon = "highlight"
speak = "Laser pointer"
action = { kind = "shortcut", keys = "L" }

[[key]]
label = "Black"
icon = "crop_square"
speak = "Black screen"
action = { kind = "shortcut", keys = "B" }

[[key]]
label = "White"
icon = "light_mode"
speak = "White screen"
action = { kind = "shortcut", keys = "W" }

[[key]]
label = "Captions"
icon = "closed_caption"
action = { kind = "shortcut", keys = "Ctrl+Shift+C" }

[[pack.tested]]
os = "linux"
by = "Sundar"
date = "2026-10-18"
note = "Arch Linux, i3 (X11), Firefox"
