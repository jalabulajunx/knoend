# Drafted by the KnoEnd configure agent (gemini/gemini-3.8-flash) on Linux, then used and kept by
# Sundar. Tested on Linux only: other systems need their own match entries and a test.
[[key]]
label = "Type"
speak = "Filter by file type"

[key.action]
kind = "element"
selector = 'div[aria-label="Type"]'

[[key]]
label = "People"
speak = "Filter by people"

[key.action]
kind = "element"
selector = 'div[aria-label="People"]'

[[key]]
label = "Modified"
speak = "Filter by modification date"

[key.action]
kind = "element"
selector = 'div[aria-label="Modified"]'

[[key]]
label = "Source"
speak = "Filter by source"

[key.action]
kind = "element"
selector = 'div[aria-label="Source"]'

[[key]]
label = "Adv Search"
speak = "Advanced search"

[key.action]
kind = "element"
selector = 'button[aria-label="Advanced search"]'

[[key]]
label = "Clear Search"
speak = "Clear search query"

[key.action]
kind = "element"
selector = 'button[aria-label="Clear search"]'

[[key]]
label = "Close Sheet"
speak = "Close side sheet"

[key.action]
kind = "element"
selector = 'button[aria-label="Close side sheet"]'

[[key]]
label = "Settings"
speak = "Open Drive settings"

[key.action]
kind = "element"
selector = 'div[aria-label="Settings"]'

[match]
web = ["drive.google.com/drive/recent"]

[pack]
description = "Quick filters and controls for recently accessed files in Google Drive."
id = "builtin.site-drive-google-com-recent"
name = "Google Drive Recent"
source = "builtin"
version = "0.1.0"

[[pack.tested]]
os = "linux"
by = "Sundar"
date = "2026-10-18"
note = "Arch Linux, i3 (X11), Firefox"
