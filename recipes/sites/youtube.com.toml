# Built-in library for browsing YouTube. Page keys need the KnoEnd extension with board buttons
# turned on for youtube.com; a video page uses youtube-watch.toml instead.
[pack]
id = "builtin.youtube"
name = "YouTube"
version = "0.2.0"
source = "builtin"
license = "MIT"

[match]
web = ["youtube.com"]

[[key]]
label = "Search"
icon = "search"
action = { kind = "focus", selector = "input[name=\"search_query\"]" }

[[key]]
label = "Home"
icon = "home"
action = { kind = "open", url = "/" }

[[key]]
label = "Subscriptions"
icon = "subscriptions"
action = { kind = "open", url = "/feed/subscriptions" }

[[key]]
label = "History"
icon = "history"
action = { kind = "open", url = "/feed/history" }

[[key]]
label = "Shorts"
icon = "movie"
action = { kind = "open", url = "/shorts" }

[[key]]
label = "You"
icon = "person"
speak = "Your library"
action = { kind = "open", url = "/feed/you" }

[[key]]
label = "Play/Pause"
icon = "play_arrow"
speak = "Play or pause"
action = { kind = "media", command = "toggle" }

[[pack.tested]]
os = "linux"
by = "Sundar"
date = "2026-10-18"
note = "Arch Linux, i3 (X11), Firefox"
