# Drafted by the KnoEnd configure agent (gemini/gemini-3.8-flash) on Linux, then used and kept by
# Sundar. Tested on Linux only: other systems need their own match entries and a test.
[[key]]
label = "New Tab"
speak = "Open new tab"

[key.action]
keys = "Primary+T"
kind = "shortcut"

[[key]]
confirm = true
label = "Close Tab"
speak = "Close current tab"

[key.action]
keys = "Primary+W"
kind = "shortcut"

[[key]]
label = "Reopen Tab"
speak = "Reopen closed tab"

[key.action]
keys = "Primary+Shift+T"
kind = "shortcut"

[[key]]
label = "Address Bar"
speak = "Focus address bar"

[key.action]
keys = "Primary+L"
kind = "shortcut"

[[key]]
label = "Reload"
speak = "Reload page"

[key.action]
keys = "Primary+R"
kind = "shortcut"

[[key]]
label = "Find"
speak = "Find in page"

[key.action]
keys = "Primary+F"
kind = "shortcut"

[[key]]
label = "Bookmark"
speak = "Bookmark current tab"

[key.action]
keys = "Primary+D"
kind = "shortcut"

[[key]]
label = "History"
speak = "Open browsing history"

[key.action]
keys = "Primary+H"
kind = "shortcut"

[[key]]
label = "Downloads"
speak = "Open downloads"

[key.action]
keys = "Primary+J"
kind = "shortcut"

[match]
linux = ["google-chrome"]

[pack]
description = "Common navigation and tab management shortcuts for Google Chrome on Linux."
id = "builtin.google-chrome"
name = "Google Chrome"
source = "builtin"
version = "0.1.0"

[[pack.tested]]
os = "linux"
by = "Sundar"
date = "2026-10-18"
note = "Arch Linux, i3 (X11)"
