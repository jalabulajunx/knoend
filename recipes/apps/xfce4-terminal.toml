# Drafted by the KnoEnd configure agent (gemini/gemini-3.8-flash) on Linux, then used and kept by
# Sundar. Tested on Linux only: other systems need their own match entries and a test.
[[key]]
label = "Copy"
speak = "Copy"

[key.action]
keys = "Primary+Shift+C"
kind = "shortcut"

[[key]]
label = "Paste"
speak = "Paste"

[key.action]
keys = "Primary+Shift+V"
kind = "shortcut"

[[key]]
label = "New Tab"
speak = "New tab"

[key.action]
keys = "Primary+Shift+T"
kind = "shortcut"

[[key]]
confirm = true
label = "Close Tab"
speak = "Close tab"

[key.action]
keys = "Primary+Shift+W"
kind = "shortcut"

[[key]]
label = "Find"
speak = "Find in terminal"

[key.action]
keys = "Primary+Shift+F"
kind = "shortcut"

[[key]]
label = "Prev Tab"
speak = "Previous tab"

[key.action]
keys = "Primary+PageUp"
kind = "shortcut"

[[key]]
label = "Next Tab"
speak = "Next tab"

[key.action]
keys = "Primary+PageDown"
kind = "shortcut"

[[key]]
label = "New Window"
speak = "New window"

[key.action]
keys = "Primary+Shift+N"
kind = "shortcut"

[[key]]
label = "Fullscreen"
speak = "Toggle fullscreen"

[key.action]
keys = "F11"
kind = "shortcut"

[match]
linux = ["xfce4-terminal"]

[pack]
description = "Default shortcuts for tab management, clipboard, and navigation in Xfce Terminal."
id = "builtin.xfce4-terminal"
name = "Xfce Terminal"
source = "builtin"
version = "0.1.0"

[[pack.tested]]
os = "linux"
by = "Sundar"
date = "2026-10-18"
note = "Arch Linux, i3 (X11)"
