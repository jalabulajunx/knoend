# Windows desktop shortcuts. Reference: docs/windows-pager.md.
# No tested entry until physical key presses have been checked.
[pack]
id = "builtin.teams"
name = "Microsoft Teams"
version = "0.1.0"
source = "builtin"
description = "Windows desktop meeting controls and navigation. Meeting keys need a meeting; mic/camera are toggles, not state indicators."
grid = "3x3"

[match]
windows = ["ms-teams.exe","ms-teams","Teams.exe","Teams"]

[[key]]
page = 1
slot = 1
label = "Mic toggle"
icon = "mic"
action = { kind = "shortcut", keys = "Ctrl+Shift+M" }

[[key]]
page = 1
slot = 2
label = "Camera"
icon = "videocam"
action = { kind = "shortcut", keys = "Ctrl+Shift+O" }

[[key]]
page = 1
slot = 3
label = "Hand toggle"
icon = "person"
action = { kind = "shortcut", keys = "Ctrl+Shift+K" }

[[key]]
page = 1
slot = 4
label = "Share tray"
icon = "present_to_all"
action = { kind = "shortcut", keys = "Ctrl+Shift+E" }

[[key]]
page = 1
slot = 5
label = "Start Steno"
icon = "description"
action = { kind = "command", name = "start-steno" }

[[key]]
page = 1
slot = 6
label = "Leave call"
icon = "call_end"
confirm = true
action = { kind = "shortcut", keys = "Ctrl+Shift+H" }

[[key]]
page = 1
slot = 7
label = "Audio answer"
icon = "call"
confirm = true
action = { kind = "shortcut", keys = "Ctrl+Shift+S" }

[[key]]
page = 1
slot = 8
label = "Decline call"
icon = "cancel"
confirm = true
action = { kind = "shortcut", keys = "Ctrl+Shift+D" }

[[key]]
page = 1
slot = 9
label = "Shortcuts"
icon = "keyboard"
action = { kind = "shortcut", keys = "Ctrl+Period" }

[[key]]
page = 2
slot = 1
label = "Search"
icon = "search"
action = { kind = "shortcut", keys = "Ctrl+E" }

[[key]]
page = 2
slot = 2
label = "Go to chat"
icon = "chat"
action = { kind = "shortcut", keys = "Ctrl+G" }

[[key]]
page = 2
slot = 3
label = "Unread chats"
icon = "notifications"
action = { kind = "shortcut", keys = "Ctrl+Alt+U" }

[[key]]
page = 2
slot = 4
label = "Chat list"
icon = "view_list"
action = { kind = "shortcut", keys = "Ctrl+L" }

[[key]]
page = 2
slot = 5
label = "Messages"
icon = "chat_bubble"
action = { kind = "shortcut", keys = "Ctrl+M" }

[[key]]
page = 2
slot = 6
label = "Compose"
icon = "edit"
action = { kind = "shortcut", keys = "Ctrl+R" }

[[key]]
page = 2
slot = 7
label = "Back"
icon = "arrow_back"
action = { kind = "shortcut", keys = "Alt+Left" }

[[key]]
page = 2
slot = 8
label = "Next section"
icon = "tab"
action = { kind = "shortcut", keys = "Ctrl+F6" }

[[key]]
page = 2
slot = 9
label = "Settings"
icon = "settings"
action = { kind = "shortcut", keys = "Ctrl+Comma" }
