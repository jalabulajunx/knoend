[[key]]
icon = "save"
label = "Save"

[key.action]
keys = "Primary+S"
kind = "shortcut"

[[key]]
icon = "undo"
label = "Undo"

[key.action]
keys = "Primary+Z"
kind = "shortcut"

[[key]]
icon = "content_copy"
label = "Copy"

[key.action]
keys = "Primary+C"
kind = "shortcut"

[[key]]
icon = "content_paste"
label = "Paste"

[key.action]
keys = "Primary+V"
kind = "shortcut"

[[key]]
icon = "search"
label = "Find"

[key.action]
keys = "Primary+F"
kind = "shortcut"

[[key]]
icon = "folder_open"
