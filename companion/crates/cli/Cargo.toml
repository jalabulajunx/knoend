[package]
name = "knoend"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
knoend-agents = { version = "0.2.1", path = "../agents" }
knoend-core = { version = "0.2.1", path = "../core" }
knoend-flash = { version = "0.2.1", path = "../flash" }
knoend-focus = { version = "0.2.1", path = "../focus" }
knoend-input = { version = "0.2.1", path = "../input" }
knoend-media = { version = "0.2.1", path = "../media" }
knoend-desktop = { version = "0.2.1", path = "../desktop" }
knoend-transport = { version = "0.2.1", path = "../transport" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
base64 = "0.22"
midir = "0.11.1"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
toml = "1.1.8"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
