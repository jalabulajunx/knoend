[package]
name = "openpager"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
openpager-agents = { version = "0.1.0", path = "../agents" }
openpager-core = { version = "0.1.0", path = "../core" }
openpager-focus = { version = "0.1.0", path = "../focus" }
openpager-transport = { version = "0.1.0", path = "../transport" }
rpassword = "7.5.4"
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "1.1.8"
