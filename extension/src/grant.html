<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OpenPager: allow this site</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="grant.css">
</head>
<body>
  <main>
    <header><img src="icons/icon-48.png" alt=""> <strong>OpenPager</strong></header>
    <h1>Let your board use buttons on <span id="site"></span>?</h1>
    <p class="muted">Your board asked to act on this site. Allowing it lets the board press buttons,
      control media and read the names of the page's controls on this one site. It never reads what
      you type, and you can turn it off in the OpenPager toolbar button.</p>
    <div class="buttons">
      <button id="allow">Allow</button>
      <button id="deny" class="off">Not now</button>
    </div>
    <p id="note" class="muted small"></p>
  </main>
  <script src="grant.js"></script>
</body>
</html>
