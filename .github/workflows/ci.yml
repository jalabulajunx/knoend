name: CI

on:
  push:
    branches: [main, "sundar/**", "tom/**"]
  pull_request:

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: python tools/validate_spec.py
      - run: python tools/build_extension.py
      - run: node --check extension/src/background.js && node --check extension/src/popup.js

  companion:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: companion
      - run: cargo build --locked
      - run: cargo test --locked
      # The Windows installer builds (installer/windows/knoend.iss), to try before a release.
      - if: runner.os == 'Windows'
        shell: pwsh
        working-directory: .
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=0.0.0" "/DExe=$PWD\companion\target\debug\knoend.exe" "/DOutDir=$PWD\out" installer\windows\knoend.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: out

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.4
          target: esp32s3
          path: firmware
          command: idf.py -B build/universal build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      # The release tool needs a version: the nearest tag and commit (full history is fetched).
      - run: sudo chown -R "$USER" firmware/build && python tools/release_firmware.py --version "$(git describe --tags --always | sed 's/^v//')" --out dist/firmware
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/firmware
