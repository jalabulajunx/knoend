name: Release

# Push a tag like v0.2.0 to publish firmware (universal image + board definitions + manifest.json),
# the knoend service (Linux and macOS archives; Windows as an installer and a zip) and the browser
# extension (Chrome and Firefox zips, unsigned) as a GitHub release. The service downloads
# firmware from releases/latest, so the newest release is what users install.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.4
          target: esp32s3
          path: firmware
          command: idf.py -B build/universal build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: sudo chown -R "$USER" firmware/build && python tools/release_firmware.py --version "${GITHUB_REF_NAME#v}" --out dist/firmware
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/firmware

  service:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
        working-directory: companion
      - if: runner.os != 'Windows'
        run: |
          mkdir -p out
          tar -C companion/target/${{ matrix.target }}/release -czf out/knoend-${{ matrix.target }}.tar.gz knoend
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path "companion/target/${{ matrix.target }}/release/knoend.exe" -DestinationPath "out/knoend-${{ matrix.target }}.zip"
      # The installer (per user, no administrator rights; installer/windows/knoend.iss). Not signed.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$version" "/DExe=$PWD\companion\target\${{ matrix.target }}\release\knoend.exe" "/DOutDir=$PWD\out" installer\windows\knoend.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: service-${{ matrix.target }}
          path: out

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_extension.py --version "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: dist/extension/knoend-*.zip

  publish:
    needs: [firmware, service, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "KnoEnd $GITHUB_REF_NAME" \
            --notes-file installer/release-notes.md \
            assets/firmware/* assets/service-*/* assets/extension/*
        env:
          GH_TOKEN: ${{ github.token }}
